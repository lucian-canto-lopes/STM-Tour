{% extends 'admin/base.html' %}{% block content %}<a class="back" href="{{ url_for('admin.index') }}">← Voltar aos locais</a><section class="panel narrow"><h1>{{ 'Editar local' if place else 'Novo local' }}</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Nome</label><input id="name" name="name" maxlength="120" required value="{{ values.get('name', '') }}"><label for="description">Descrição</label><textarea id="description" name="description" rows="7" maxlength="5000" required>{{ values.get('description', '') }}</textarea>{% if place %}<img class="preview" src="{{ url_for('admin.photo', place_id=place._id) }}" alt="Foto atual de {{ place.name }}">{% endif %}<label for="photo">{{ 'Substituir foto (opcional)' if place else 'Foto' }}</label><input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" {{ 'required' if not place }} aria-describedby="photo-help"><small id="photo-help">JPG, PNG ou WebP. Até 5 MB e 20 megapixels.{% if place %} Sem novo arquivo, a foto atual será mantida.{% endif %}</small><div class="actions"><button>Salvar local</button><a class="button secondary" href="{{ url_for('admin.index') }}">Cancelar</a></div></form></section>{% endblock %}
