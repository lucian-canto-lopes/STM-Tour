<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#009c7d"><title>Administração · STM Tour</title><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head><body><div class="admin-app"><header><a class="brand" href="{{ url_for('admin.index') }}">STM Tour <small>Administração</small></a>{% if session.get('user_id') %}<form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Sair</button></form>{% endif %}</header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></div></body></html>
