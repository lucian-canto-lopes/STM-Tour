services:
  web:
    build:
      context: .
    command: flask --app wsgi run --host=0.0.0.0 --port=5000 --debug
    ports:
      - "${FLASK_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    # MongoDB 8+ bloqueia kernels Linux 6.19 a 7.0.13 (SERVER-121912).
    # Esta versão é compatível com o ambiente Docker de desenvolvimento atual.
    image: mongo:6.0.26
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "localhost:27017/admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
